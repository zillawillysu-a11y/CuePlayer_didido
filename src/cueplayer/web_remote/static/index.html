<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#050505" />
  <title>CuePlayer Remote</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">CuePlayer</div>
    <div class="project" id="projectName">—</div>
    <button type="button" class="ghost" id="authBtn" title="Password">Key</button>
  </header>

  <main class="layout">
    <section class="panel setlist" aria-label="Setlist">
      <h2>Setlist</h2>
      <div id="songList" class="song-list"></div>
    </section>

    <section class="panel stage" aria-label="Transport">
      <div class="song-title" id="songTitle">No song</div>
      <div class="clock-row">
        <div class="clock" id="clock">00:00:00.00</div>
        <div class="duration" id="duration">/ 00:00:00.00</div>
      </div>
      <div class="timecode" id="timecode">01:00:00:00</div>

      <div class="now-grid">
        <div class="now-card primary">
          <div class="now-label">NOW</div>
          <div class="now-body" id="nowPrimary">—</div>
        </div>
        <div class="now-card secondary">
          <div class="now-label">BUTTON</div>
          <div class="now-body" id="nowSecondary">—</div>
        </div>
      </div>

      <div class="wave-wrap" id="waveWrap" aria-label="Waveform">
        <canvas id="waveCanvas" width="900" height="120"></canvas>
        <div class="wave-empty" id="waveEmpty">No waveform yet</div>
      </div>

      <div class="transport" role="group" aria-label="Transport">
        <button type="button" class="icon-btn" id="prevSong" aria-label="Previous song" title="Previous song">
          <svg viewBox="0 0 34 30" aria-hidden="true"><path d="M20 7 L11 15 L20 23" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 7 V23" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="icon-btn" id="playBtn" aria-label="Play" title="Play">
          <svg viewBox="0 0 34 30" aria-hidden="true"><path d="M12 7 L12 23 L25 15 Z" fill="currentColor"/></svg>
        </button>
        <button type="button" class="icon-btn" id="pauseBtn" aria-label="Pause" title="Pause">
          <svg viewBox="0 0 34 30" aria-hidden="true"><rect x="10" y="7" width="5.5" height="16" rx="1.2" fill="currentColor"/><rect x="18.5" y="7" width="5.5" height="16" rx="1.2" fill="currentColor"/></svg>
        </button>
        <button type="button" class="icon-btn" id="stopBtn" aria-label="Stop" title="Stop">
          <svg viewBox="0 0 34 30" aria-hidden="true"><rect x="10" y="8" width="14" height="14" rx="1.5" fill="currentColor"/></svg>
        </button>
        <button type="button" class="icon-btn" id="nextSong" aria-label="Next song" title="Next song">
          <svg viewBox="0 0 34 30" aria-hidden="true"><path d="M14 7 L23 15 L14 23" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 7 V23" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="marks" id="markButtons" aria-label="Mark shortcuts"></div>
    </section>

    <section class="panel cues" aria-label="Cue list">
      <h2>Cues</h2>
      <div id="cueList" class="cue-list"></div>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>

  <dialog id="authDialog">
    <form method="dialog" class="auth-form">
      <h3>Remote password</h3>
      <p>Same password as Tools → Web Remote on the PC.</p>
      <input type="password" id="passwordInput" autocomplete="current-password" />
      <div class="auth-actions">
        <button value="cancel" class="ghost">Cancel</button>
        <button value="ok" class="primary" id="savePassword">Save</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
