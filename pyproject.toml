[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cueplayer"
version = "0.1.0"
description = "Timeline tool for lighting programming: multi-audio, LTC, VJ clips, and grandMA export"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "CuePlayer" }]
dependencies = [
  "PySide6>=6.7",
  "numpy>=2.0",
  "sounddevice>=0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
cueplayer = "cueplayer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
